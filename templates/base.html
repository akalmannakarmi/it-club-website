<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} · {{page_settings.org_name}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% if page_settings.page_icon %}
        <link rel="icon" type="image/png" href="{{ page_settings.page_icon.url }}">
    {% endif %}

    <!-- Google Fonts: Inter (Swiss / editorial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind theme config lives AFTER the CDN script so the tailwind global exists -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        body: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            200: '#C7D2FE',
                            300: '#A5B4FC',
                            400: '#818CF8',
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA',
                            800: '#3730A3',
                            900: '#312E81',
                        },
                        accent: {
                            50: '#FFF7ED',
                            100: '#FFEDD5',
                            200: '#FED7AA',
                            300: '#FDBA74',
                            400: '#FB923C',
                            500: '#F97316',
                            600: '#EA580C',
                            700: '#C2410C',
                            800: '#9A3412',
                            900: '#7C2D12',
                        },
                        ink: '#1E1B4B',
                        muted: '#EBEEF8',
                        line: '#D6DEF7',
                    },
                },
            },
        };
    </script>

    <!-- Swiper.js for sliders -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10.3.1/swiper-bundle.min.css" integrity="sha384-WDy11dc+3v52BOTt9WHuWenX6bjqGVBwYrU4XtgPIrneMtg1bXhpmWEZECSNrasO" crossorigin="anonymous"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10.3.1/swiper-bundle.min.js" integrity="sha384-UpSTlZpLDzenAXs6CRRa5gU7uk1xaEJy+7uIz+c0niFDR3yuAlqzV7w0SgZhmEX3" crossorigin="anonymous"></script>

    <!-- AOS for scroll animations -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" integrity="sha384-/rJKQnzOkEo+daG0jMjU1IwwY9unxt1NBw3Ef2fmOJ3PW/TfAg2KXVoWwMZQZtw9" crossorigin="anonymous">

    <style>
        html { scroll-behavior: smooth; }
        section[id], [id] { scroll-margin-top: 4rem; }
        :focus-visible { outline: 2px solid #4F46E5; outline-offset: 2px; }
        ::selection { background: #E0E7FF; color: #312E81; }
        .swiper-button-next, .swiper-button-prev {
            color: #4F46E5;
            width: 2.75rem;
            height: 2.75rem;
            background: #FFFFFF;
            border: 1px solid #E6E8F0;
            border-radius: 9999px;
            box-shadow: 0 2px 8px rgba(23, 23, 23, 0.06);
        }
        .swiper-button-next::after, .swiper-button-prev::after { font-size: 16px; font-weight: 700; }
        .nav-link { position: relative; }
        .nav-link.active {
            color: #4F46E5;
            background: #EEF2FF;
        }
        .nav-scrolled {
            box-shadow: 0 1px 0 rgba(23, 23, 23, 0.08);
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
            html { scroll-behavior: auto; }
        }
    </style>
</head>
<body class="bg-white text-ink font-body antialiased">

    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:bg-brand-600 focus:px-4 focus:py-2 focus:text-white">
        Skip to main content
    </a>

    <main id="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Common scripts -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js" integrity="sha384-n1AULnKdMJlK1oQCLNDL9qZsDgXtH6jRYFCpBtWFc+a9Yve0KSoMn575rk755NJZ" crossorigin="anonymous"></script>
    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!prefersReducedMotion) {
            AOS.init({ duration: 600, once: true, offset: 80 });
        }
    </script>

    {% include "toast-handler.html" %}
    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
