{% extends "base.html" %}

{% block content %}
<section class="min-h-screen bg-gradient-to-b from-indigo-50 to-white flex items-center justify-center py-12 px-4">
  <div class="max-w-7xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2">
    
    <!-- Left Banner / Image -->
    <div class="hidden md:flex flex-col justify-center items-center bg-indigo-700 p-12 text-center">
      <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" 
           alt="IT Club" class="rounded-2xl shadow-lg mb-6">
      <h2 class="text-4xl font-bold text-white mb-4">Join the IT Club</h2>
      <p class="text-indigo-200 text-lg">
        Collaborate, learn, and build real-world projects with like-minded peers.
      </p>
    </div>

    <!-- Form Section -->
    <div class="p-12 relative">
      <!-- Back button -->
      <a href="{% url 'home' %}" class="flex items-center text-indigo-600 font-semibold hover:text-indigo-700 mb-6">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" 
             viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 19l-7-7 7-7"></path>
        </svg>
        Back
      </a>

      <h2 class="text-3xl font-bold text-indigo-700 mb-4">Register Now</h2>
      <p class="text-slate-600 mb-8">
        Fill out your details and become a part of our professional IT community.
      </p>

      <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% csrf_token %}

        <!-- Username & Full Name -->
        <div class="col-span-2">
          <label class="block text-slate-700 font-medium mb-1">Full Name</label>
          <input type="text" name="full_name" placeholder="Full Name"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Email & Phone -->
        <div class="col-span-2 md:col-span-1">
          <label class="block text-slate-700 font-medium mb-1">Email</label>
          <input type="email" name="email" placeholder="Email"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="col-span-2 md:col-span-1">
          <label class="block text-slate-700 font-medium mb-1">Phone Number</label>
          <input type="text" name="phone_number" placeholder="Phone Number"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Batch & Faculty -->
        <div class="col-span-2 md:col-span-1">
          <label class="block text-slate-700 font-medium mb-1">Batch</label>
          <input type="text" name="batch" placeholder="e.g., 2023-2026"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="col-span-2 md:col-span-1">
          <label class="block text-slate-700 font-medium mb-1">Faculty</label>
          <input type="text" name="faculty" placeholder="Faculty"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Password & Confirm Password -->
        <div class="col-span-2 md:col-span-1">
          <label class="block text-slate-700 font-medium mb-1">Password</label>
          <input type="password" name="password1" placeholder="Password"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="col-span-2 md:col-span-1">
          <label class="block text-slate-700 font-medium mb-1">Confirm Password</label>
          <input type="password" name="password2" placeholder="Confirm Password"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Submit Button -->
        <div class="col-span-2 mt-4">
          <button type="submit" 
                  class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-semibold hover:bg-indigo-700 transition shadow-md hover:shadow-lg">
            Register
          </button>
        </div>
      </form>

      <!-- Login Link -->
      <p class="mt-6 text-center text-slate-600 text-sm">
        Already a member? 
        <a href="{% url 'user:login' %}" class="text-indigo-600 font-semibold hover:underline">Login here</a>
      </p>
    </div>

  </div>
</section>
{% endblock %}
