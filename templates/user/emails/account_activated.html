<!doctype html>
<html>
  <body style="font-family: Arial; background: #f1f5f9; padding: 40px">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            width="600"
            style="background: white; border-radius: 12px; padding: 40px"
          >
            <tr>
              <td>
                <h2 style="color: #4f46e5">Account Activated 🎉</h2>

                <p>Hello {{ user.first_name }},</p>

                <p>
                  Good news! Your account has been approved and activated by the
                  administrator.
                </p>

                <p>You can now log in and access the platform.</p>

                <p style="margin: 30px 0">
                  <a
                    href="{{ protocol }}://{{ domain }}/accounts/login/"
                    style="
                      background: #4f46e5;
                      color: white;
                      padding: 12px 24px;
                      text-decoration: none;
                      border-radius: 8px;
                      font-weight: 600;
                    "
                  >
                    Login to your account
                  </a>
                </p>

                <p>Welcome to the community!</p>

                <br />

                <p style="color: #64748b; font-size: 14px">
                  {{ page_settings.org_name }} Team
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
