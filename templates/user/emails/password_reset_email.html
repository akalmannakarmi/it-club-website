<!doctype html>
<html>
  <body
    style="font-family: Arial, sans-serif; background: #f1f5f9; padding: 40px"
  >
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            width="600"
            style="background: white; border-radius: 12px; padding: 40px"
          >
            <tr>
              <td align="center">
                <h2 style="color: #4f46e5; margin-bottom: 20px">
                  Reset Your Password
                </h2>

                <p style="color: #475569; font-size: 16px">
                  You requested a password reset for your {{ site_name }}
                  account.
                </p>

                <p style="margin: 30px 0">
                  <a
                    href="{{ protocol }}://{{ domain }}{% url 'user:password_reset_confirm' uidb64=uid token=token %}"
                    style="
                      background: #4f46e5;
                      color: white;
                      padding: 14px 28px;
                      text-decoration: none;
                      border-radius: 8px;
                      font-weight: 600;
                      display: inline-block;
                    "
                  >
                    Reset Password
                  </a>
                </p>

                <p style="color: #64748b; font-size: 14px">
                  If you didn’t request this password reset, you can safely
                  ignore this email.
                </p>

                <hr style="margin: 30px 0" />

                <p style="color: #94a3b8; font-size: 13px">
                  {{ site_name }} Team
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
