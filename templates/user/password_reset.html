{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="min-h-screen bg-gradient-to-b from-indigo-50 to-white flex items-center justify-center py-12 px-4">
  <div class="max-w-lg w-full bg-white rounded-3xl shadow-2xl p-10">

    <a href="{% url 'user:login' %}" class="flex items-center text-indigo-600 font-semibold hover:text-indigo-700 mb-6">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M15 19l-7-7 7-7"></path>
      </svg>
      Back to Login
    </a>

    <h2 class="text-3xl font-bold text-indigo-700 mb-4">
      Forgot Password
    </h2>

    <p class="text-slate-600 mb-6">
      Enter your email and we'll send you a link to reset your password.
    </p>

    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-slate-700 font-medium mb-1">
          Email Address
        </label>

        <input
          type="email"
          name="email"
          value="{{ form.email.value|default:'' }}"
          required
          class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >

        {% if form.email.errors %}
          <p class="text-red-500 text-sm mt-1">
            {{ form.email.errors.0 }}
          </p>
        {% endif %}
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-semibold hover:bg-indigo-700 transition shadow-md hover:shadow-lg"
      >
        Send Reset Link
      </button>

    </form>

  </div>
</section>
{% endblock %}
