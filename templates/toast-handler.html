<!-- Toast Container -->
<div id="toast-container"
     class="fixed top-5 right-5 z-50 space-y-4 w-full max-w-sm">

    {% if messages %}
        {% for message in messages %}
            <div 
                class="toast flex items-start gap-3 p-4 rounded-xl shadow-lg border 
                {% if message.tags == 'error' %}
                    bg-red-50 border-red-200 text-red-700
                {% elif message.tags == 'success' %}
                    bg-green-50 border-green-200 text-green-700
                {% elif message.tags == 'warning' %}
                    bg-yellow-50 border-yellow-200 text-yellow-700
                {% else %}
                    bg-blue-50 border-blue-200 text-blue-700
                {% endif %}
                animate-slide-in"
            >
                <div class="flex-1 text-sm font-medium">
                    {{ message }}
                </div>

                <button onclick="this.parentElement.remove()"
                        class="text-lg leading-none opacity-70 hover:opacity-100">
                    &times;
                </button>
            </div>
        {% endfor %}
    {% endif %}

</div>
<script>
    AOS.init({ duration: 800, once: true });

    // Auto-dismiss toasts after 4 seconds
    document.addEventListener("DOMContentLoaded", function () {
        const toasts = document.querySelectorAll(".toast");

        toasts.forEach((toast, index) => {
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-x-5");
                setTimeout(() => toast.remove(), 300);
            }, 4000 + (index * 500)); // slight delay between multiple toasts
        });
    });
</script>

<style>
    .animate-slide-in {
        animation: slideIn 0.4s ease forwards;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(40px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
</style>
