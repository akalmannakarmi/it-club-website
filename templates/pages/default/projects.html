<section id="projects" class="py-28 bg-slate-50">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-3xl font-bold mb-12">Projects</h2>

    <div class="swiper projectsSwiper" data-aos="fade-up">
      <div class="swiper-wrapper w-full p-4">
        {% for project in projects %}
        <div class="swiper-slide bg-white rounded-3xl shadow-lg overflow-hidden">
          {% if project.image %}
          <img src="{{project.image.url}}" class="h-64 w-full object-cover">
          {% endif %}
          <div class="p-6">
            <h3 class="font-semibold text-xl mb-2">{{project.title}}</h3>
            <p class="text-slate-600 mb-2">{{project.caption}}</p>
            <a href="#" class="text-indigo-600 font-semibold">View Project →</a>
          </div>
        </div>
        {% endfor %}
      </div>

      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

    <div class="text-center mt-6">
      <a href="#" class="text-indigo-600 font-semibold hover:underline">
        View All Projects →
      </a>
    </div>
  </div>
</section>
