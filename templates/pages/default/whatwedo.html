<section class="py-28 bg-slate-50">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-3xl font-bold mb-12">What We Do</h2>

    <div class="swiper mySwiper" data-aos="fade-up">
      <div class="swiper-wrapper">
        {% for activity in whatwedos %}
        <div class="swiper-slide bg-white p-10 rounded-3xl shadow-lg flex flex-col items-center">
          {% if activity.image %}
          <img src="{{activity.image.url}}" class="h-32 w-32 object-cover rounded-full mb-4">
          {% endif %}
          <h3 class="text-xl font-semibold mb-2">{{activity.title}}</h3>
          <p class="text-slate-600 text-center">
            {{activity.caption}}
          </p>
        </div>
        {% endfor %}
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>
    <div class="text-center mt-6">
      <a href="#" class="text-indigo-600 font-semibold hover:underline">
        View All Activities →
      </a>
    </div>
  </div>
</section>
