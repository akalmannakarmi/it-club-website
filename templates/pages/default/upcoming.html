{% load math_filters %}
<section class="py-28 bg-white">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-3xl font-bold mb-12">Upcoming Activities</h2>
    <div class="grid md:grid-cols-3 gap-8">
      {% for event in upcomingEvents %}
      <div class="flex items-start gap-4 bg-slate-50 p-6 rounded-2xl shadow mt-{{ forloop.counter0|multiply:8 }}">
        <div class="text-indigo-600 font-bold text-xl">{{ event.date|date:"M j" }}</div>
        <div>
          <h4 class="font-semibold mb-1">{{event.title}}</h4>
          <p class="text-slate-600 text-sm">{{event.caption}}</p>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="text-center mt-6">
      <a href="#" class="text-indigo-600 font-semibold hover:underline">
        View Full Calendar →
      </a>
    </div>
  </div>
</section>
