{% load static %}
<section id="events" class="bg-brand-50 py-24 lg:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-end justify-between gap-4" data-aos="fade-up">
      <div>
        <span class="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-[0.2em] text-brand-600">
          <span class="h-px w-8 bg-accent-500"></span>
          Highlights
        </span>
        <h2 class="mt-4 font-heading text-3xl font-bold tracking-tight text-ink sm:text-4xl">Major Events</h2>
      </div>
      <a href="{% url 'events' %}" class="inline-flex h-11 items-center gap-2 rounded-xl border border-line bg-white px-5 text-sm font-semibold text-brand-600 transition-colors duration-150 hover:border-brand-300 hover:bg-brand-50 hover:text-brand-700">
        View all events
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>

    <div class="swiper majorEventsSwiper mt-12" data-aos="fade-up">
      <div class="swiper-wrapper w-full p-4">
        {% for event in majorEvents %}
        <div class="swiper-slide group h-full">
          <div class="flex h-full flex-col overflow-hidden rounded-3xl border border-line bg-white shadow-sm transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl hover:shadow-brand-600/10">
            <div class="relative">
              <img
                src="{% if event.image %}{{ event.image.url }}{% else %}{% static 'image/event-default.png' %}{% endif %}"
                onerror="this.onerror=null;this.src='{% static 'image/event-default.png' %}'"
                alt="{{ event.title }}"
                class="h-52 w-full object-cover"
              >
              <span class="absolute left-4 top-4 rounded-full bg-accent-50 px-3 py-1 text-xs font-semibold text-accent-700 shadow-sm ring-1 ring-accent-200">
                {{ event.date|date:"M j" }}
              </span>
            </div>
            <div class="flex flex-1 flex-col p-6">
              <a href="{% url 'event_detail' event.pk %}">
                <h3 class="font-heading text-xl font-semibold tracking-tight text-ink group-hover:text-brand-700 transition-colors duration-150">{{ event.title }}</h3>
              </a>
              {% if event.caption %}
                <p class="mt-2 line-clamp-2 text-sm text-slate-600">{{ event.caption }}</p>
              {% endif %}
              <div class="mt-auto pt-5">
                <a href="{% url 'event_detail' event.pk %}" class="inline-flex items-center gap-1.5 text-sm font-semibold text-brand-600 transition-colors duration-150 hover:text-brand-700">
                  View Event
                  <svg class="h-4 w-4 transition-transform duration-150 group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </a>
              </div>
            </div>
          </div>
        </div>
        {% empty %}
        <p class="swiper-slide rounded-3xl border border-line bg-white p-8 text-center text-slate-500">No major events yet.</p>
        {% endfor %}
      </div>

      <div class="swiper-button-next hidden lg:flex"></div>
      <div class="swiper-button-prev hidden lg:flex"></div>
    </div>
  </div>
</section>
