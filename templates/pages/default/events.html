<section id="events" class="py-28 bg-slate-50">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-3xl font-bold mb-12">Major Events</h2>

    <div class="swiper majorEventsSwiper" data-aos="fade-up">
      <div class="swiper-wrapper">
        {% for event in majorEvents %}
        <div class="swiper-slide bg-white rounded-3xl overflow-hidden shadow-lg">
          {% if event.image %}
          <img src="{{event.image.url}}" class="h-64 w-full object-cover">
          {% endif %}
          <div class="p-6">
            <h3 class="text-xl font-semibold mb-2">{{event.title}}</h3>
            <p class="text-slate-600 mb-4">{{event.caption}}</p>
            <a href="#" class="text-indigo-600 font-semibold">View Event →</a>
          </div>
        </div>
        {% endfor %}
      </div>

      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

    <div class="text-center mt-6">
      <a href="#" class="text-indigo-600 font-semibold hover:underline">
        View All Events →
      </a>
    </div>
  </div>
</section>
