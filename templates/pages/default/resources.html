<section id="resources" class="py-28 bg-white">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-3xl font-bold mb-12">Learning Resources</h2>

    <div class="swiper resourcesSwiper" data-aos="fade-up">
      <div class="swiper-wrapper w-full p-4">
        {% for resource in resources %}
        <div class="swiper-slide bg-slate-50 p-6 rounded-2xl shadow flex flex-col items-center">
          {% if resource.image %}
          <img src="{{resource.image.url}}" class="h-20 w-20 mb-4">
          {% endif %}
          <h3 class="font-semibold mb-2">{{resource.title}}</h3>
          <p class="text-slate-600 text-center text-sm">{{resource.caption}}</p>
        </div>
        {% endfor %}
      </div>

      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

    <div class="text-center mt-6">
      <a href="#" class="text-indigo-600 font-semibold hover:underline">
        View All Resources →
      </a>
    </div>
  </div>
</section>
