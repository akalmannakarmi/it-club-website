{% load static %}

<style>
  .event {
    background: #e9fced;
    font-family: "Segoe UI", sans-serif;
  }

  .small-title {
    color: #6b7280;
    letter-spacing: 2px;
    font-size: 14px;
  }

  h1 {
    color: #0b2545;
  }

  .icon {
    width: 48px;
    height: 48px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .cta-btn {
    display: inline-block;
    margin-top: 35px;
    padding: 14px 32px;
    background: #1209c4;
    color: #fff;
    border-radius: 30px;
    text-decoration: none;
    transition: 0.3s;
  }

  .cta-btn:hover {
    background: #0e07a8;
    box-shadow: 0 8px 20px rgba(18,9,196,0.4);
    transform: translateY(-2px);
  }

  .left img {
    max-width: 390px;
    border-radius: 8px;
    transition: 0.3s;
  }

  .left img:hover {
    transform: scale(1.03);
  }
</style>

<section class="event">

<section class="py-5">
  <div class="container">
    <div class="row align-items-center g-5">

      <!-- LEFT IMAGE -->
      <div class="col-lg-5 text-center left">
        <img src= "{% static 'image/resource1.png' %}" alt="Campus" class="img-fluid">
        
        <img src= "{% static 'image/resource1.png' %}" alt="Campus" class="img-fluid">
      </div>

      <!-- RIGHT CONTENT -->
      <div class="col-lg-7">
        <span class="small-title">EVENTS</span>

        <h1 class="display-5 fw-bold my-4">
          Stay updated with our <br>
          upcoming events
        </h1>

        <!-- Item -->
        <div class="d-flex gap-3 mb-4">
          <div class="icon">📅</div>
          <div>
            <h5 class="fw-semibold">Orientation Day</h5>
            <p class="text-muted mb-0">
              Join us on <b>Monday, 9:00 AM</b> for campus orientation.
            </p>
          </div>
        </div>

        <!-- Item -->
        <div class="d-flex gap-3 mb-4">
          <div class="icon">🎓</div>
          <div>
            <h5 class="fw-semibold">Guest Lecture Series</h5>
            <p class="text-muted mb-0">
              Next lecture on <b>15 January 2026</b> by Dr. Smith.
            </p>
          </div>
        </div>

        <!-- Item -->
        <div class="d-flex gap-3 mb-4">
          <div class="icon">🏟️</div>
          <div>
            <h5 class="fw-semibold">Sports Meet</h5>
            <p class="text-muted mb-0">
              Scheduled for <b>5 February 2026</b>.
            </p>
          </div>
        </div>

        <a href="{% url 'events' %}" class="cta-btn">View All Events</a>
      </div>

    </div>
  </div>
</section>
</section>
