{% extends "base.html" %}

{% block content %}
<div class="flex min-h-screen bg-slate-950 text-slate-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 border-r border-slate-800">
    <div class="h-16 flex items-center px-6 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold text-indigo-400">IT Club</h1>
        <p class="text-xs text-slate-400">Dashboard</p>
      </div>
    </div>

    <nav class="px-4 py-6 space-y-1 text-sm">

      <!-- Dashboard -->
      <a href="{% url 'dashboard:home' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition
     {% if active_page == 'dashboard' %}
       bg-indigo-500/10 text-indigo-400
     {% else %}
       hover:bg-slate-800 text-slate-300
     {% endif %}">

        <!-- Chart Bar Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 3v18h18M9 17V9m4 8V5m4 12v-6" />
        </svg>

        Dashboard
      </a>


      <!-- Page Settings -->
      <a href="{% url 'dashboard:page_settings' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition
     {% if active_page == 'page_settings' %}
       bg-indigo-500/10 text-indigo-400
     {% else %}
       hover:bg-slate-800 text-slate-300
     {% endif %}">

        <!-- Adjustments / Sliders Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h10M4 18h7" />
        </svg>

        Page Settings
      </a>


      <!-- Members -->
      <a href="{% url 'dashboard:member_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition
     {% if active_page == 'members' %}
       bg-indigo-500/10 text-indigo-400
     {% else %}
       hover:bg-slate-800 text-slate-300
     {% endif %}">

        <!-- Users Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M17 20h5v-2a4 4 0 00-5-3.87M9 20H4v-2a4 4 0 015-3.87m8-6a4 4 0 11-8 0 4 4 0 018 0zm6 0a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>

        Members
      </a>

      <!-- Projects -->
      <a href="{% url 'dashboard:project_list' %}" 
        class="flex items-center gap-3 px-4 py-3 rounded-xl transition
        {% if active_page == 'project_list' %}
          bg-indigo-500/10 text-indigo-400
        {% else %}
          hover:bg-slate-800 text-slate-300
        {% endif %}">

        <!-- Folder / Project Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" 
            class="w-5 h-5" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor">
          <path stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="1.8"
                d="M3 7h4l3 3h11v11H3V7z" />
        </svg>

        Projects
      </a>



      <!-- What We Do -->
      <a href="{% url 'dashboard:what_we_do_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition
      {% if active_page == 'what_we_do_list' %}
        bg-indigo-500/10 text-indigo-400
      {% else %}
        hover:bg-slate-800 text-slate-300
      {% endif %}">

        <!-- Grid Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M4 6h7v7H4V6zm9 0h7v7h-7V6zM4 15h7v7H4v-7zm9 7v-7h7v7h-7z"/>
        </svg>

        What We Do
      </a>

      <!-- Events -->
      <a href="{% url 'dashboard:event_list' %}" 
        class="flex items-center gap-3 px-4 py-3 rounded-xl transition
        {% if active_page == 'event_list' %}
          bg-indigo-500/10 text-indigo-400
        {% else %}
          hover:bg-slate-800 text-slate-300
        {% endif %}">

        <!-- Calendar Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" 
            class="w-5 h-5" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor">
          <path stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="1.8"
                d="M8 7V3m8 4V3m-9 8h10m-13 9h16a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v11a2 2 0 002 2z" />
        </svg>

        Events
      </a>

      <!-- Resources -->
      <a href="{% url 'dashboard:resource_list' %}" 
        class="flex items-center gap-3 px-4 py-3 rounded-xl transition
        {% if active_page == 'resource_list' %}
          bg-indigo-500/10 text-indigo-400
        {% else %}
          hover:bg-slate-800 text-slate-300
        {% endif %}">

        <!-- Book / Document Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" 
            class="w-5 h-5" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor">
          <path stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="1.8"
                d="M12 6v13m0-13C10.343 4.343 8.343 3.5 6 3.5S1.657 4.343 0 6v13c1.657-1.657 3.657-2.5 6-2.5s4.343.843 6 2.5m0-13c1.657-1.657 3.657-2.5 6-2.5s4.343.843 6 2.5v13c-1.657-1.657-3.657-2.5-6-2.5s-4.343.843-6 2.5" />
        </svg>

        Resources
      </a>

      <!-- Audit Logs -->
      <a href="{% url 'dashboard:audit_list' %}" 
        class="flex items-center gap-3 px-4 py-3 rounded-xl transition
        {% if active_page == 'audit_list' %}
          bg-indigo-500/10 text-indigo-400
        {% else %}
          hover:bg-slate-800 text-slate-300
        {% endif %}">

        <!-- Clipboard / Activity Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" 
            class="w-5 h-5" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor">
          <path stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="1.8"
                d="M9 5h6m-6 4h6m-7 4h8m2 7H6a2 2 0 01-2-2V5a2 2 0 012-2h3m6 0h3a2 2 0 012 2v14a2 2 0 01-2 2z" />
        </svg>

        Audit Logs
      </a>


      <!-- Back to Site -->
      <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition">

        <!-- Globe Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M21 12A9 9 0 1112 3a9 9 0 019 9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12h18" />
        </svg>

        Back to Site
      </a>

    </nav>
  </aside>

  <!-- Main Area -->
  <div class="flex-1 flex flex-col">

    <!-- Topbar -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6">
      <h2 class="text-xl font-semibold text-slate-100">
        {% block page_title %}Dashboard{% endblock %}
      </h2>

      <div class="flex items-center gap-4 text-sm text-slate-300">
        <span>{{ user.full_name }}</span>

        <form method="POST" action="{% url 'user:logout' %}">
          {% csrf_token %}
          <button type="submit" class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400
                        hover:bg-red-500/20 transition">
            Logout
          </button>
        </form>
      </div>
    </header>

    <!-- Subcontent -->
    <main class="flex-1 p-6 bg-slate-950">
      {% block subcontent %}{% endblock %}
    </main>

  </div>
</div>
{% endblock %}
