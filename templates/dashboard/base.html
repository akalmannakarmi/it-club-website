{% extends "base.html" %}

{% block content %}
<div class="flex min-h-screen bg-slate-950 text-slate-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 border-r border-slate-800">
    <div class="h-16 flex items-center px-6 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold text-indigo-400">IT Club</h1>
        <p class="text-xs text-slate-400">Dashboard</p>
      </div>
    </div>

    <nav class="px-4 py-6 space-y-1 text-sm">

      <a href="{% url 'dashboard:home' %}"
         class="block px-4 py-3 rounded-xl transition
         {% if active_page == 'dashboard' %}
           bg-indigo-500/10 text-indigo-400
         {% else %}
           hover:bg-slate-800 text-slate-300
         {% endif %}">
        📊 Dashboard
      </a>

      <a href="{% url 'dashboard:member_list' %}"
         class="block px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition">
        👥 Members
      </a>

      <a href="/" class="block px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 transition">
        🌐 Back to Site
      </a>

    </nav>
  </aside>

  <!-- Main Area -->
  <div class="flex-1 flex flex-col">

    <!-- Topbar -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6">
      <h2 class="text-xl font-semibold text-slate-100">
        {% block page_title %}Dashboard{% endblock %}
      </h2>

      <div class="flex items-center gap-4 text-sm text-slate-300">
        <span>{{ user.username }}</span>

        <form method="POST" action="{% url 'user:logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400
                        hover:bg-red-500/20 transition">
            Logout
            </button>
        </form>
        </div>
    </header>

    <!-- Subcontent -->
    <main class="flex-1 p-6 bg-slate-950">
      {% block subcontent %}{% endblock %}
    </main>

  </div>
</div>
{% endblock %}
